submission:
  title: "Evidence Pro"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Crime scene investigators are routinely overwhelmed by volume — the 2019 Hyderabad veterinarian murder case alone produced 3,000+ photos and 200+ physical items — with no systematic way to decide what gets examined first. Without prioritization, perishable, high-value evidence (a DNA-bearing cigarette butt was nearly missed in that case) can be buried under low-value items, while backlogged Forensic Science Laboratories (FSLs) add weeks of delay on top.


  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    We built Evidence Pro, an AI-powered evidence triage assistant with two engines, both running on IBM watsonx.ai. For photos, watsonx's Granite Vision model scans crime scene images and flags probable evidence categories and time-sensitive items directly. For written item lists, watsonx's Granite text model extracts only observable facts from each description (not a priority judgment), which a trained decision tree then classifies deterministically — returning the exact split-by-split reasoning behind every ranking, so investigators get a fully explainable, ranked FSL submission schedule instead of a black-box score.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Explainable decision-tree prioritization "
    - "Gen AI narrowed to fact-extraction, not judgment"
    - "Perishability-aware urgency flagging"                               # optional 4th
    - ""                               # optional 5th

  tech_stack:
    languages: [Python, JavaScript, HTML, CSS]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: [Flask, Flask-CORS]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: []               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: [None — stateless request/response pipeline]                      # e.g., ["PostgreSQL", "Redis"]
    other: []                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Replace with what aspect of the submission you consider strongest
    and want judges to pay special attention to.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Replace with any known limitations, incomplete features,
    or shortcuts taken due to time constraints.

